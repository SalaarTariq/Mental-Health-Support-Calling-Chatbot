[project]
name = "calmlink"
version = "1.0.0"
description = "CalmLink — Mental health support chatbot with crisis detection and Twilio calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",         # FIX: was 'unicorn' (wrong package entirely)
    "pydantic>=2.10.0",
    "requests>=2.32.0",
    "streamlit>=1.40.0",
    "twilio>=9.0.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",  # Groq cloud LLM integration
    "python-dotenv>=1.0.0",    # NEW: needed for .env file loading
]
